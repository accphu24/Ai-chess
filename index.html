<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Chess AI Arena</title>
<style>
  :root { --bg:#f6f5f2; --fg:#222; --card:#fff; --muted:#666; --bd:#ddd; --accent:#2b6cb0; --light:#f0d9b5; --dark:#b58863; --hl:#f7ec74; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1b1b1b; --fg:#eee; --card:#262626; --muted:#aaa; --bd:#3a3a3a; --accent:#63a4ff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui, sans-serif; }
  h1 { font-size:20px; margin:0 0 12px; }
  h1 small { color:var(--muted); font-weight:400; font-size:12px; }
  .wrap { display:flex; flex-wrap:wrap; gap:16px; max-width:980px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:12px; }
  .left { flex:0 0 auto; width:min(94vw, 504px); }
  .right { flex:1 1 300px; min-width:280px; display:flex; flex-direction:column; gap:12px; }
  #bw { width:100%; }
  /* Kích thước ô do JS tính (--cell, đơn vị px) nên mọi ô luôn bằng nhau trên mọi trình duyệt */
  #board { display:grid; grid-template-columns:repeat(8, var(--cell, 40px)); grid-auto-rows:var(--cell, 40px); width:max-content; border:2px solid var(--dark); margin:0 auto; }
  .sq { width:var(--cell, 40px); height:var(--cell, 40px); display:flex; align-items:center; justify-content:center; font-size:calc(var(--cell, 40px) * 0.78); line-height:1; overflow:hidden; }
  .sq.l { background:var(--light); } .sq.d { background:var(--dark); } .sq.h { background:var(--hl); }
  .sq span { forced-color-adjust:none; }
  .w { color:#fff; -webkit-text-fill-color:#fff; text-shadow:0 0 2px #000,0 0 2px #000,0 0 2px #000,0 0 1px #000; }
  .b { color:#000; -webkit-text-fill-color:#000; text-shadow:0 0 1px rgba(255,255,255,.55); }
  #status { font-weight:600; margin-top:10px; min-height:1.4em; }
  #status.ready { color:#2f9e5b; }
  #status.warn { color:#d69e2e; }
  input[type=checkbox] { width:auto; margin-right:6px; vertical-align:middle; }
  .chk { display:block; margin-top:10px; font-size:14px; color:var(--fg); }
  .players { color:var(--muted); font-size:13px; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:2px; }
  input, select { width:100%; padding:7px 8px; border:1px solid var(--bd); border-radius:6px; background:var(--bg); color:var(--fg); font:inherit; }
  .row { display:flex; gap:8px; } .row > div { flex:1; min-width:0; }
  .btns { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  button { padding:8px 12px; border:1px solid var(--bd); border-radius:6px; background:var(--card); color:var(--fg); font:inherit; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #log { max-height:340px; overflow:auto; font-size:14px; }
  .mv { font-weight:600; margin-top:6px; } .note { color:var(--muted); font-size:13px; white-space:pre-wrap; }
  .hint { font-size:12px; color:var(--muted); margin-top:6px; }
  #err { color:#c53030; font-size:13px; margin-top:6px; min-height:1em; }
</style>
</head>
<body>
<div class="wrap">
  <div class="left card">
    <h1>Chess AI Arena <small>v5</small></h1>
    <div id="bw"><div id="board"></div></div>
    <div id="status">Đang tải...</div>
    <div class="players" id="players"></div>
  </div>

  <div class="right">
    <div class="card">
      <div class="row">
        <div><label>Trắng</label><select id="whiteSel"></select></div>
        <div><label>Đen</label><select id="blackSel"></select></div>
      </div>
      <div class="row" style="margin-top:8px">
        <div><label>Nghỉ giữa các nước (giây)</label><input id="delay" type="number" min="0" max="30" step="0.5" value="1"></div>
        <div><label>Giới hạn nửa-nước</label><input id="maxplies" type="number" min="10" max="400" value="200"></div>
      </div>
      <label class="chk"><input type="checkbox" id="manual" checked>Chế độ từng nước: AI nghĩ xong thì chờ tôi bấm "Tiếp tục" mới đi</label>
      <div class="btns">
        <button class="primary" id="start">Bắt đầu ván mới</button>
        <button class="primary" id="cont" disabled>Tiếp tục</button>
        <button id="pause" disabled>Tạm dừng</button>
        <button id="stop" disabled>Dừng</button>
        <button id="pgn" disabled>Tải PGN</button>
        <button id="reload">Tải lại danh sách model</button>
      </div>
      <div class="hint" id="notes"></div>
      <div id="err"></div>
    </div>
    <div class="card"><div id="log"></div></div>
  </div>
</div>

<script>
const GLYPH = { K:'♚', Q:'♛', R:'♜', B:'♝', N:'♞', P:'♟\uFE0E' };
let token = localStorage.getItem('token') || '';
const $ = id => document.getElementById(id);

async function api(path, opt = {}) {
  opt.headers = Object.assign({ 'Content-Type': 'application/json', 'X-Token': token }, opt.headers || {});
  opt.cache = 'no-store';
  const r = await fetch(path, opt);
  if (r.status === 401) {
    const t = prompt('Nhập mã truy cập (ACCESS_TOKEN):');
    if (!t) throw new Error('Cần mã truy cập');
    token = t; localStorage.setItem('token', t);
    return api(path, opt);
  }
  return r;
}

/* ---- bàn cờ ---- */
function sizeBoard() {
  const avail = $('bw').clientWidth - 4;
  const cell = Math.max(24, Math.floor(Math.min(avail, 480) / 8));
  $('board').style.setProperty('--cell', cell + 'px');
}
window.addEventListener('resize', sizeBoard);

function renderBoard(fen, last) {
  const board = $('board');
  board.innerHTML = '';
  const hl = last ? [last.slice(0, 2), last.slice(2, 4)] : [];
  const rows = fen.split(' ')[0].split('/');
  function cell(r, f, p) {
    const sq = 'abcdefgh'[f] + (8 - r);
    const d = document.createElement('div');
    d.className = 'sq ' + (((r + f) % 2) ? 'd' : 'l') + (hl.includes(sq) ? ' h' : '');
    if (p) {
      const s = document.createElement('span');
      s.className = (p === p.toUpperCase()) ? 'w' : 'b';
      s.textContent = GLYPH[p.toUpperCase()];
      d.appendChild(s);
    }
    board.appendChild(d);
  }
  rows.forEach((row, r) => {
    let f = 0;
    for (const ch of row) {
      if (/\d/.test(ch)) { for (let i = 0; i < +ch; i++) cell(r, f++, ''); }
      else cell(r, f++, ch);
    }
  });
}

function renderLog(log) {
  const el = $('log');
  const stick = el.scrollTop + el.clientHeight >= el.scrollHeight - 30;
  el.innerHTML = '';
  for (const m of log) {
    const a = document.createElement('div');
    a.className = 'mv';
    a.textContent = `${m.n}${m.white ? '. ' : '... '}${m.san}  (${m.who})`;
    el.appendChild(a);
    if (m.note) {
      const n = document.createElement('div');
      n.className = 'note';
      n.textContent = m.note;
      el.appendChild(n);
    }
  }
  if (stick) el.scrollTop = el.scrollHeight;
}

function statusText(s) {
  if (s.status === 'idle') return 'Chưa có ván nào. Chọn người chơi rồi bấm "Bắt đầu".';
  if (s.status === 'error') return 'Lỗi: ' + s.message;
  if (s.status === 'stopped') return 'Đã dừng ván.';
  if (s.status === 'finished') return `Kết thúc: ${s.result} (${s.message})`;
  const side = s.turn === 'white' ? 'Trắng' : 'Đen';
  const name = s.turn === 'white' ? s.white : s.black;
  if (s.phase === 'error') return `⚠ ${s.error} — bấm "Tiếp tục" để thử lại.`;
  if (s.phase === 'ready') return `✅ ${side} (${name}) đã nghĩ xong nước đi. Bấm "Tiếp tục" để thực hiện.`;
  if (s.paused) return 'Đã tạm dừng. Bấm "Tiếp tục" để chạy tiếp.';
  if (s.phase === 'thinking') return `⏳ ${side} (${name}) đang suy nghĩ...`;
  return 'Đang chơi...';
}

async function refresh() {
  try {
    const s = await (await api('/api/state')).json();
    renderBoard(s.fen, s.last);
    renderLog(s.log);
    $('status').textContent = statusText(s);
    $('status').className = s.status !== 'running' ? '' : (s.phase === 'ready' ? 'ready' : (s.phase === 'error' ? 'warn' : ''));
    $('players').textContent = s.white ? `Trắng: ${s.white}  ·  Đen: ${s.black}` : '';
    const running = s.status === 'running';
    $('start').disabled = running;
    $('cont').disabled = !s.can_continue;
    $('pause').disabled = !running || s.manual || s.paused;
    $('stop').disabled = !running;
    $('pgn').disabled = s.status === 'idle';
  } catch (e) { $('status').textContent = e.message; }
}

async function call(path, body) {
  $('err').textContent = '';
  const r = await api(path, { method: 'POST', body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) {
    let msg = r.statusText;
    try { msg = (await r.json()).detail || msg; } catch (_) {}
    $('err').textContent = msg;
  }
  refresh();
}

/* ---- menu chọn người chơi: chỉ có lựa chọn do server cung cấp ---- */
const SIDES = ['white', 'black'];
function saved(side) { try { return localStorage.getItem('pick_' + side) || ''; } catch (_) { return ''; } }

async function loadModels(force) {
  let data;
  try {
    data = await (await api('/api/models' + (force ? '?refresh=true' : ''))).json();
  } catch (_) {
    data = { groups: [{ label: 'Cơ bản', items: [
      { spec: 'random', label: 'Random (ngẫu nhiên)' }, { spec: 'stockfish', label: 'Stockfish (engine)' } ] }],
      notes: ['Không tải được danh sách model'] };
  }
  for (const side of SIDES) {
    const sel = $(side + 'Sel');
    const keep = sel.value || saved(side);
    sel.innerHTML = '';
    for (const g of data.groups) {
      const og = document.createElement('optgroup');
      og.label = g.label;
      for (const it of g.items) {
        const o = document.createElement('option');
        o.value = it.spec; o.textContent = it.label;
        og.appendChild(o);
      }
      sel.appendChild(og);
    }
    if ([...sel.options].some(o => o.value === keep)) sel.value = keep;
    sel.onchange = () => { try { localStorage.setItem('pick_' + side, sel.value); } catch (_) {} };
  }
  $('notes').textContent = data.notes.length ? data.notes.join(' · ') : '';
}

$('start').onclick = () => call('/api/start', {
  white: $('whiteSel').value, black: $('blackSel').value,
  delay: parseFloat($('delay').value) || 0, max_plies: parseInt($('maxplies').value) || 200,
  manual: $('manual').checked,
});
$('cont').onclick = () => call('/api/continue');
$('pause').onclick = () => call('/api/pause');
try { $('manual').checked = localStorage.getItem('manual') !== '0'; } catch (_) {}
$('manual').onchange = () => {
  try { localStorage.setItem('manual', $('manual').checked ? '1' : '0'); } catch (_) {}
  call('/api/mode', { manual: $('manual').checked });
};
$('stop').onclick = () => call('/api/stop');
$('reload').onclick = () => loadModels(true);
$('pgn').onclick = async () => {
  const r = await api('/api/pgn');
  if (!r.ok) return;
  const url = URL.createObjectURL(new Blob([await r.text()], { type: 'text/plain' }));
  const a = document.createElement('a');
  a.href = url; a.download = 'game.pgn'; a.click();
  URL.revokeObjectURL(url);
};

async function loop() { await refresh(); setTimeout(loop, 1000); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
sizeBoard();
refresh().then(() => loadModels(false)).then(loop);
</script>
</body>
</html>
