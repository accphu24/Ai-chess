<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Chess AI Arena</title>
<style>
  :root { --bg:#f6f5f2; --fg:#222; --card:#fff; --muted:#666; --bd:#ddd; --accent:#2b6cb0; --light:#f0d9b5; --dark:#b58863; --hl:#f7ec74; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1b1b1b; --fg:#eee; --card:#262626; --muted:#aaa; --bd:#3a3a3a; --accent:#63a4ff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui, sans-serif; }
  h1 { font-size:20px; margin:0 0 12px; }
  h1 small { color:var(--muted); font-weight:400; font-size:12px; }
  .wrap { display:flex; flex-wrap:wrap; gap:16px; max-width:980px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:12px; }
  .left { flex:0 0 auto; width:min(94vw, 504px); }
  .right { flex:1 1 300px; min-width:280px; display:flex; flex-direction:column; gap:12px; }
  #bw { width:100%; }
  /* Kích thước ô do JS tính (--cell, đơn vị px) nên mọi ô luôn bằng nhau trên mọi trình duyệt */
  #board { display:grid; grid-template-columns:repeat(8, var(--cell, 40px)); grid-auto-rows:var(--cell, 40px); width:max-content; border:2px solid var(--dark); margin:0 auto; }
  .sq { width:var(--cell, 40px); height:var(--cell, 40px); display:flex; align-items:center; justify-content:center; font-size:calc(var(--cell, 40px) * 0.78); line-height:1; overflow:hidden; }
  .sq.l { background:var(--light); } .sq.d { background:var(--dark); } .sq.h { background:var(--hl); }
  .sq span { forced-color-adjust:none; }
  .w { color:#fff; -webkit-text-fill-color:#fff; text-shadow:0 0 2px #000,0 0 2px #000,0 0 2px #000,0 0 1px #000; }
  .b { color:#000; -webkit-text-fill-color:#000; text-shadow:0 0 1px rgba(255,255,255,.55); }
  #status { font-weight:600; margin-top:10px; min-height:1.4em; }
  #status.ready { color:#2f9e5b; }
  #status.warn { color:#d69e2e; }
  input[type=checkbox] { width:auto; margin-right:6px; vertical-align:middle; }
  .chk { display:block; margin-top:10px; font-size:14px; color:var(--fg); }
  .players { color:var(--muted); font-size:13px; white-space:pre-line; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:2px; }
  input, select { width:100%; padding:7px 8px; border:1px solid var(--bd); border-radius:6px; background:var(--bg); color:var(--fg); font:inherit; }
  .row { display:flex; gap:8px; } .row > div { flex:1; min-width:0; }
  .btns { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  button { padding:8px 12px; border:1px solid var(--bd); border-radius:6px; background:var(--card); color:var(--fg); font:inherit; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #log { max-height:340px; overflow:auto; font-size:14px; }
  .mv { font-weight:600; margin-top:6px; } .note { color:var(--muted); font-size:13px; white-space:pre-wrap; }
  .hint { font-size:12px; color:var(--muted); margin-top:6px; }
  h2 { font-size:16px; margin:0 0 8px; }
  .tbl { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { padding:5px 6px; text-align:right; border-bottom:1px solid var(--bd); white-space:nowrap; }
  th:nth-child(2), td:nth-child(2) { text-align:left; white-space:normal; word-break:break-word; min-width:110px; }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  td.elo { font-weight:700; }
  details { margin-top:10px; font-size:13px; } summary { cursor:pointer; color:var(--muted); }
  .hrow { padding:4px 0; border-bottom:1px solid var(--bd); word-break:break-word; }
  .tabs { display:flex; gap:6px; margin-bottom:10px; }
  .tab { flex:1; }
  .tab.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .chooser { max-height:210px; overflow:auto; border:1px solid var(--bd); border-radius:6px; padding:4px 8px; background:var(--bg); }
  .chooser .gl { font-size:12px; color:var(--muted); margin:6px 0 2px; font-weight:600; }
  .opt { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--fg); margin:0; padding:3px 0; word-break:break-all; }
  .opt input { width:auto; }
  .btns .g { display:contents; }
  #tourGames { max-height:220px; overflow:auto; }
  #err { color:#c53030; font-size:13px; margin-top:6px; min-height:1em; }
</style>
</head>
<body>
<div class="wrap">
  <div class="left card">
    <h1>Chess AI Arena <small>v9</small></h1>
    <div id="bw"><div id="board"></div></div>
    <div id="status">Đang tải...</div>
    <div class="players" id="players"></div>
  </div>

  <div class="right">
    <div class="card">
      <div class="tabs">
        <button class="tab on" id="tabSingle">Ván đơn</button>
        <button class="tab" id="tabTour">Giải vòng tròn</button>
      </div>

      <div id="singlePanel">
        <div class="row">
          <div><label>Trắng</label><select id="whiteSel"></select></div>
          <div><label>Đen</label><select id="blackSel"></select></div>
        </div>
        <div class="hint" id="pickHint" style="display:none">🎲 Server bốc ngẫu nhiên từ các model AI trong danh sách (kể cả Claude nếu đã đặt key, có thể tốn phí). Tên model được chọn hiện ngay khi ván bắt đầu.</div>
      </div>

      <div id="tourPanel" style="display:none">
        <label>Chọn các model tham gia (2–8)</label>
        <div class="chooser" id="tourList"></div>
        <div class="row" style="margin-top:8px">
          <div><label>Số ván mỗi cặp</label>
            <select id="gpp"><option value="2" selected>2 (đổi màu 1 lần)</option><option value="1">1</option><option value="4">4</option></select></div>
        </div>
        <div class="hint" id="tourInfo"></div>
      </div>

      <div class="row" style="margin-top:8px">
        <div><label>Nghỉ giữa các nước (giây)</label><input id="delay" type="number" min="0" max="30" step="0.5" value="1"></div>
        <div><label>Giới hạn nửa-nước</label><input id="maxplies" type="number" min="10" max="400" value="200"></div>
      </div>
      <label class="chk" id="manualWrap"><input type="checkbox" id="manual" checked>Chế độ từng nước: AI nghĩ xong thì chờ tôi bấm "Tiếp tục" mới đi</label>
      <label class="chk"><input type="checkbox" id="brief" checked>Tiết kiệm token: AI chỉ trả nước đi, không giải thích (nên bật để đỡ hết hạn mức)</label>
      <div class="btns">
        <div class="g" id="singleBtns">
          <button class="primary" id="start">Bắt đầu ván mới</button>
          <button class="primary" id="cont" disabled>Tiếp tục</button>
          <button id="pause" disabled>Tạm dừng</button>
        </div>
        <div class="g" id="tourBtns" style="display:none">
          <button class="primary" id="startTour">Bắt đầu giải</button>
        </div>
        <button id="stop" disabled>Dừng</button>
        <button id="pgn" disabled>Tải PGN</button>
        <button id="reload">Tải lại danh sách model</button>
      </div>
      <div class="hint" id="notes"></div>
      <div id="err"></div>
    </div>
    <div class="card" id="tourCard" style="display:none">
      <h2>Giải đấu</h2>
      <div id="tourStatus" style="font-weight:600; margin-bottom:6px"></div>
      <div class="tbl"><table id="tourTable"></table></div>
      <details open><summary>Các ván trong giải</summary><div id="tourGames"></div></details>
    </div>
    <div class="card"><div id="log"></div></div>
    <div class="card">
      <h2>Bảng xếp hạng</h2>
      <div class="tbl"><table id="lb"></table></div>
      <div class="hint" id="lbnote"></div>
      <div class="hint" id="store"></div>
      <details><summary>Lịch sử ván đấu gần đây</summary><div id="hist"></div></details>
      <div class="btns"><button id="clearlb">Xóa bảng xếp hạng</button></div>
    </div>
  </div>
</div>

<script>
const GLYPH = { K:'♚', Q:'♛', R:'♜', B:'♝', N:'♞', P:'♟\uFE0E' };
let token = localStorage.getItem('token') || '';
const $ = id => document.getElementById(id);

async function api(path, opt = {}) {
  opt.headers = Object.assign({ 'Content-Type': 'application/json', 'X-Token': token }, opt.headers || {});
  opt.cache = 'no-store';
  const r = await fetch(path, opt);
  if (r.status === 401) {
    const t = prompt('Nhập mã truy cập (ACCESS_TOKEN):');
    if (!t) throw new Error('Cần mã truy cập');
    token = t; localStorage.setItem('token', t);
    return api(path, opt);
  }
  return r;
}

/* ---- bàn cờ ---- */
function sizeBoard() {
  const avail = $('bw').clientWidth - 4;
  const cell = Math.max(24, Math.floor(Math.min(avail, 480) / 8));
  $('board').style.setProperty('--cell', cell + 'px');
}
window.addEventListener('resize', sizeBoard);

function renderBoard(fen, last) {
  const board = $('board');
  board.innerHTML = '';
  const hl = last ? [last.slice(0, 2), last.slice(2, 4)] : [];
  const rows = fen.split(' ')[0].split('/');
  function cell(r, f, p) {
    const sq = 'abcdefgh'[f] + (8 - r);
    const d = document.createElement('div');
    d.className = 'sq ' + (((r + f) % 2) ? 'd' : 'l') + (hl.includes(sq) ? ' h' : '');
    if (p) {
      const s = document.createElement('span');
      s.className = (p === p.toUpperCase()) ? 'w' : 'b';
      s.textContent = GLYPH[p.toUpperCase()];
      d.appendChild(s);
    }
    board.appendChild(d);
  }
  rows.forEach((row, r) => {
    let f = 0;
    for (const ch of row) {
      if (/\d/.test(ch)) { for (let i = 0; i < +ch; i++) cell(r, f++, ''); }
      else cell(r, f++, ch);
    }
  });
}

function renderLog(log) {
  const el = $('log');
  const stick = el.scrollTop + el.clientHeight >= el.scrollHeight - 30;
  el.innerHTML = '';
  for (const m of log) {
    const a = document.createElement('div');
    a.className = 'mv';
    a.textContent = `${m.n}${m.white ? '. ' : '... '}${m.san}  (${m.who})`;
    el.appendChild(a);
    if (m.note) {
      const n = document.createElement('div');
      n.className = 'note';
      n.textContent = m.note;
      el.appendChild(n);
    }
  }
  if (stick) el.scrollTop = el.scrollHeight;
}

function statusText(s) {
  const T = s.tournament;
  if (T && T.active) {
    const pre = `🏆 Giải đấu, ván ${T.index}/${T.total}: `;
    return pre + (s.status === 'running' ? gameStatusText(s) : 'đang chuẩn bị ván tiếp theo...');
  }
  return gameStatusText(s);
}

function gameStatusText(s) {
  if (s.status === 'idle') return 'Chưa có ván nào. Chọn người chơi rồi bấm "Bắt đầu".';
  if (s.status === 'error') return 'Lỗi: ' + s.message;
  if (s.status === 'stopped') return 'Đã dừng ván.';
  if (s.status === 'finished') return `Kết thúc: ${s.result} (${s.message})`;
  const side = s.turn === 'white' ? 'Trắng' : 'Đen';
  const name = s.turn === 'white' ? s.white : s.black;
  if (s.phase === 'error') return `⚠ ${s.error} — bấm "Tiếp tục" để thử lại.`;
  if (s.phase === 'ready') return `✅ ${side} (${name}) đã nghĩ xong nước đi. Bấm "Tiếp tục" để thực hiện.`;
  if (s.paused) return 'Đã tạm dừng. Bấm "Tiếp tục" để chạy tiếp.';
  if (s.phase === 'thinking') return `⏳ ${side} (${name}) đang suy nghĩ...`;
  return 'Đang chơi...';
}

async function refresh() {
  try {
    const s = await (await api('/api/state')).json();
    renderBoard(s.fen, s.last);
    renderLog(s.log);
    if (s.results_count !== undefined) onResultsChanged(s.results_count);
    $('status').textContent = statusText(s);
    $('status').className = s.status !== 'running' ? '' : (s.phase === 'ready' ? 'ready' : (s.phase === 'error' ? 'warn' : ''));
    const tk = s.tokens;
    const used = tk ? tk.white[0] + tk.white[1] + tk.black[0] + tk.black[1] : 0;
    const fmt = n => n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n);
    $('players').textContent = s.white ? `Trắng: ${s.white}  ·  Đen: ${s.black}` : '';
    if (s.white && used > 0) $('players').textContent += `\nToken (vào/ra): Trắng ${fmt(tk.white[0])}/${fmt(tk.white[1])} · Đen ${fmt(tk.black[0])}/${fmt(tk.black[1])}`;
    const T = s.tournament;
    const tourActive = !!(T && T.active);
    renderTournament(T);
    if (tourActive && !autoSwitched) { autoSwitched = true; setMode('tour'); }
    const running = s.status === 'running';
    const busy = running || tourActive;
    $('start').disabled = busy;
    $('startTour').disabled = busy;
    $('cont').disabled = tourActive || !s.can_continue;
    $('pause').disabled = tourActive || !running || s.manual || s.paused;
    $('stop').disabled = !busy;
    $('stop').textContent = tourActive ? 'Dừng giải' : 'Dừng';
    $('pgn').disabled = s.status === 'idle';
  } catch (e) { $('status').textContent = e.message; }
}

async function call(path, body) {
  $('err').textContent = '';
  const r = await api(path, { method: 'POST', body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) {
    let msg = r.statusText;
    try { msg = (await r.json()).detail || msg; } catch (_) {}
    $('err').textContent = msg;
  }
  refresh();
}

/* ---- menu chọn người chơi: chỉ có lựa chọn do server cung cấp ---- */
const SIDES = ['white', 'black'];
function saved(side) { try { return localStorage.getItem('pick_' + side) || ''; } catch (_) { return ''; } }

async function loadModels(force) {
  let data;
  try {
    data = await (await api('/api/models' + (force ? '?refresh=true' : ''))).json();
  } catch (_) {
    data = { groups: [{ label: 'Cơ bản', items: [
      { spec: 'random', label: 'Random (ngẫu nhiên)' }, { spec: 'stockfish', label: 'Stockfish (engine)' } ] }],
      notes: ['Không tải được danh sách model'] };
  }
  for (const side of SIDES) {
    const sel = $(side + 'Sel');
    const keep = sel.value || saved(side);
    sel.innerHTML = '';
    for (const g of data.groups) {
      const og = document.createElement('optgroup');
      og.label = g.label;
      for (const it of g.items) {
        const o = document.createElement('option');
        o.value = it.spec; o.textContent = it.label;
        og.appendChild(o);
      }
      sel.appendChild(og);
    }
    if ([...sel.options].some(o => o.value === keep)) sel.value = keep;
    sel.onchange = () => { try { localStorage.setItem('pick_' + side, sel.value); } catch (_) {} updatePickHint(); };
  }
  updatePickHint();
  buildTourList(data);
  $('notes').textContent = data.notes.length ? data.notes.join(' · ') : '';
}

$('start').onclick = () => call('/api/start', {
  white: $('whiteSel').value, black: $('blackSel').value,
  delay: parseFloat($('delay').value) || 0, max_plies: parseInt($('maxplies').value) || 200,
  manual: $('manual').checked, brief: $('brief').checked,
});

/* ---- chế độ ván đơn / giải đấu ---- */
let autoSwitched = false;
function setMode(m) {
  $('singlePanel').style.display = m === 'single' ? '' : 'none';
  $('tourPanel').style.display = m === 'tour' ? '' : 'none';
  $('singleBtns').style.display = m === 'single' ? 'contents' : 'none';
  $('tourBtns').style.display = m === 'tour' ? 'contents' : 'none';
  $('manualWrap').style.display = m === 'single' ? '' : 'none';
  $('tabSingle').classList.toggle('on', m === 'single');
  $('tabTour').classList.toggle('on', m === 'tour');
  $('err').textContent = '';
}
$('tabSingle').onclick = () => setMode('single');
$('tabTour').onclick = () => setMode('tour');

function updatePickHint() {
  $('pickHint').style.display = SIDES.some(sd => $(sd + 'Sel').value === 'pick:random') ? '' : 'none';
}

let tourSel = new Set();
try { tourSel = new Set(JSON.parse(localStorage.getItem('tourSel') || '[]')); } catch (_) {}
const llmCount = spec => (spec === 'random' || spec === 'stockfish') ? 0 : 1;

function updateTourInfo() {
  const sel = [...tourSel], n = sel.length;
  const gpp = parseInt($('gpp').value) || 2, maxp = parseInt($('maxplies').value) || 200;
  const games = n * (n - 1) / 2 * gpp;
  let calls = 0;
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) calls += (llmCount(sel[i]) + llmCount(sel[j])) * (maxp / 2) * gpp;
  let txt = `Đã chọn ${n}/8.`;
  if (n < 2) txt += ' Chọn ít nhất 2.';
  else {
    txt += ` Tổng ${games} ván`;
    txt += calls ? `, tối đa ~${Math.round(calls)} lượt gọi API (chưa tính thử lại). Gói miễn phí hay bị giới hạn nên nên nghỉ 2-5 giây giữa các nước.` : '.';
  }
  if (n > 8) txt += ' ⚠ Quá 8 model.'; else if (games > 60) txt += ' ⚠ Vượt 60 ván.';
  if (gpp === 1 && n >= 2) txt += ' (1 ván mỗi cặp thì màu quân không cân bằng.)';
  $('tourInfo').textContent = txt;
}

function buildTourList(data) {
  const box = $('tourList');
  box.innerHTML = '';
  const avail = new Set();
  for (const g of data.groups) {
    if (g.label === 'Đặc biệt') continue;
    const title = document.createElement('div');
    title.className = 'gl'; title.textContent = g.label;
    box.appendChild(title);
    for (const it of g.items) {
      avail.add(it.spec);
      const lab = document.createElement('label');
      lab.className = 'opt';
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.value = it.spec; cb.checked = tourSel.has(it.spec);
      cb.onchange = () => {
        if (cb.checked) tourSel.add(it.spec); else tourSel.delete(it.spec);
        try { localStorage.setItem('tourSel', JSON.stringify([...tourSel])); } catch (_) {}
        updateTourInfo();
      };
      lab.appendChild(cb);
      lab.appendChild(document.createTextNode(it.label));
      box.appendChild(lab);
    }
  }
  tourSel = new Set([...tourSel].filter(s => avail.has(s)));
  updateTourInfo();
}

function renderTournament(T) {
  const card = $('tourCard');
  if (!T) { card.style.display = 'none'; return; }
  card.style.display = '';
  $('tourStatus').textContent = T.status === 'running' ? `🏆 Đang chạy: ván ${T.index}/${T.total}`
    : T.status === 'finished' ? `🏁 Giải đã kết thúc (${T.total} ván)` : `⏹ Giải đã dừng ở ván ${T.index}/${T.total}`;
  const t = $('tourTable');
  t.innerHTML = '';
  const head = document.createElement('tr');
  ['#', 'Model', 'Điểm', 'Ván', 'T-H-B'].forEach(x => head.appendChild(cellOf('th', x)));
  t.appendChild(head);
  T.standings.forEach((r, i) => {
    const tr = document.createElement('tr');
    tr.appendChild(cellOf('td', i + 1));
    tr.appendChild(cellOf('td', r.name));
    tr.appendChild(cellOf('td', r.points, 'elo'));
    tr.appendChild(cellOf('td', r.games));
    tr.appendChild(cellOf('td', `${r.w}-${r.d}-${r.l}`));
    t.appendChild(tr);
  });
  const box = $('tourGames');
  box.innerHTML = '';
  T.games.forEach((g, i) => {
    const row = document.createElement('div');
    row.className = 'hrow';
    const res = g.result === '' ? 'đang chơi...' : g.result === 'void' ? `hủy (${g.reason})`
      : g.result === 'stopped' ? 'đã dừng' : (RESULT_TEXT[g.result] || g.result);
    row.textContent = `${i + 1}. ${g.white} (Trắng) vs ${g.black} (Đen): ${res}`;
    box.appendChild(row);
  });
}

$('gpp').onchange = updateTourInfo;
$('maxplies').oninput = updateTourInfo;
$('startTour').onclick = () => {
  const models = [...tourSel];
  if (models.length < 2) { $('err').textContent = 'Hãy chọn ít nhất 2 người chơi cho giải đấu.'; return; }
  call('/api/tournament/start', { models, games_per_pair: parseInt($('gpp').value) || 2,
    delay: parseFloat($('delay').value) || 0, max_plies: parseInt($('maxplies').value) || 200, brief: $('brief').checked });
};

$('cont').onclick = () => call('/api/continue');
$('pause').onclick = () => call('/api/pause');
try { $('manual').checked = localStorage.getItem('manual') !== '0'; } catch (_) {}
try { $('brief').checked = localStorage.getItem('brief') !== '0'; } catch (_) {}
$('brief').onchange = () => { try { localStorage.setItem('brief', $('brief').checked ? '1' : '0'); } catch (_) {} };
$('manual').onchange = () => {
  try { localStorage.setItem('manual', $('manual').checked ? '1' : '0'); } catch (_) {}
  call('/api/mode', { manual: $('manual').checked });
};
$('stop').onclick = () => call('/api/stop');
$('reload').onclick = () => loadModels(true);
$('pgn').onclick = async () => {
  const r = await api('/api/pgn');
  if (!r.ok) return;
  const url = URL.createObjectURL(new Blob([await r.text()], { type: 'text/plain' }));
  const a = document.createElement('a');
  a.href = url; a.download = 'game.pgn'; a.click();
  URL.revokeObjectURL(url);
};


/* ---- bảng xếp hạng ---- */
const REASONS = {
  CHECKMATE: 'chiếu bí', STALEMATE: 'hết nước đi (hòa)', INSUFFICIENT_MATERIAL: 'không đủ quân',
  FIFTY_MOVES: 'luật 50 nước', SEVENTYFIVE_MOVES: 'luật 75 nước',
  THREEFOLD_REPETITION: 'lặp thế cờ', FIVEFOLD_REPETITION: 'lặp thế cờ',
};
const RESULT_TEXT = { '1-0': 'Trắng thắng', '0-1': 'Đen thắng', '1/2-1/2': 'Hòa', '*': 'Hòa (hết giới hạn nước)' };

function cellOf(tag, text, cls) {
  const c = document.createElement(tag);
  c.textContent = text;
  if (cls) c.className = cls;
  return c;
}

async function loadLeaderboard() {
  try {
    const d = await (await api('/api/leaderboard')).json();
    const t = $('lb');
    t.innerHTML = '';
    const head = document.createElement('tr');
    [['#', ''], ['Model', ''], ['Elo', 'Điểm Elo, khởi đầu 1000'], ['T-H-B', 'Thắng - Hòa - Bại'],
     ['Điểm', '% điểm (thắng 1, hòa 0,5)'], ['Sai luật', '% nước AI trả sai luật quá số lần thử, bị thay bằng nước ngẫu nhiên']]
      .forEach(([h, tip]) => { const th = cellOf('th', h); if (tip) th.title = tip; head.appendChild(th); });
    t.appendChild(head);
    d.leaderboard.forEach((r, i) => {
      const tr = document.createElement('tr');
      tr.appendChild(cellOf('td', i + 1));
      tr.appendChild(cellOf('td', r.name));
      tr.appendChild(cellOf('td', r.elo, 'elo'));
      tr.appendChild(cellOf('td', `${r.w}-${r.d}-${r.l}`));
      tr.appendChild(cellOf('td', r.score_pct + '%'));
      tr.appendChild(cellOf('td', r.illegal_pct + '%'));
      t.appendChild(tr);
    });
    $('lbnote').textContent = d.leaderboard.length
      ? 'Elo khởi đầu 1000, K=32. Cần nhiều ván mới đáng tin; nên cho model đấu với Random/Stockfish làm mốc. Ván hai bên cùng model, ván bị dừng giữa chừng không được tính; ván hết giới hạn nước tính là hòa.'
      : 'Chưa có ván nào được tính. Hãy cho hai model khác nhau đấu một ván hoàn chỉnh (ván cùng model hai bên không được tính).';
    const sg = d.storage || {};
    $('store').textContent = sg.backend === 'mongodb' ? '💾 Đang lưu vào MongoDB.'
      : sg.configured ? `⚠ Không kết nối được MongoDB (${sg.error || 'lỗi'}). Đang lưu tạm vào file, sẽ mất khi deploy lại.`
      : 'Chưa cấu hình MongoDB: dữ liệu lưu tạm vào file trên server và trình duyệt của bạn.';
    const h = $('hist');
    h.innerHTML = '';
    for (const r of d.recent) {
      const row = document.createElement('div');
      row.className = 'hrow';
      const reason = REASONS[r.reason] || r.reason;
      row.textContent = `${r.white} (Trắng) vs ${r.black} (Đen): ${RESULT_TEXT[r.result] || r.result}, ${Math.ceil(r.plies / 2)} nước${reason ? ' · ' + reason : ''}`;
      h.appendChild(row);
    }
  } catch (_) {}
}

/* Server (Render miễn phí) có thể mất dữ liệu khi deploy lại → giữ bản sao trong trình duyệt và đồng bộ ngược */
async function syncResults() {
  try {
    const server = (await (await api('/api/results')).json()).results;
    let local = [];
    try { local = JSON.parse(localStorage.getItem('results') || '[]'); } catch (_) {}
    const map = new Map();
    for (const r of local.concat(server)) if (r && r.id) map.set(r.id, r);
    const merged = [...map.values()];
    if (merged.length > server.length) {
      await api('/api/results/import', { method: 'POST', body: JSON.stringify({ results: merged }) });
    }
    try { localStorage.setItem('results', JSON.stringify(merged)); } catch (_) {}
  } catch (_) {}
}

$('clearlb').onclick = async () => {
  if (!confirm('Xóa toàn bộ bảng xếp hạng và lịch sử ván đấu?')) return;
  await api('/api/results', { method: 'DELETE' });
  try { localStorage.removeItem('results'); } catch (_) {}
  loadLeaderboard();
};

let lastCount = null;
async function onResultsChanged(count) {
  if (count === lastCount) return;
  lastCount = count;
  await syncResults();
  await loadLeaderboard();
}

async function loop() { await refresh(); setTimeout(loop, 1000); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
sizeBoard();
refresh().then(() => loadModels(false)).then(loop);
</script>
