app = "chess-ai-arena-CHANGE-ME"   # đổi thành tên duy nhất của bạn
primary_region = "sin"             # Singapore, gần Việt Nam

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
